<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="itGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#itGrad)" filter="url(#shadow)" />
  
  <!-- Subtle Top Specular Glass Reflection -->
  <rect x="2" y="2" width="60" height="30" rx="16" fill="url(#glowGrad)" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" />

  <!-- Outer Circuit Trace Pins -->
  <g stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.95">
    <!-- Top Pins -->
    <line x1="26" y1="12" x2="26" y2="18" />
    <line x1="38" y1="12" x2="38" y2="18" />
    <!-- Bottom Pins -->
    <line x1="26" y1="46" x2="26" y2="52" />
    <line x1="38" y1="46" x2="38" y2="52" />
    <!-- Left Pins -->
    <line x1="12" y1="26" x2="18" y2="26" />
    <line x1="12" y1="38" x2="18" y2="38" />
    <!-- Right Pins -->
    <line x1="46" y1="26" x2="52" y2="26" />
    <line x1="46" y1="38" x2="52" y2="38" />
  </g>

  <!-- Microchip Outer Border -->
  <rect x="18" y="18" width="28" height="28" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />

  <!-- Inner Chip Core / Intelligent Node -->
  <rect x="23" y="23" width="18" height="18" rx="3.5" fill="#FFFFFF" />

  <!-- Tech Accent Symbol inside Core (Stylized Monogram 'iT') -->
  <path d="M28 27 H36 V30 H33.5 V37 H30.5 V30 H28 Z" fill="#2563EB" />
  <circle cx="36" cy="35" r="1.5" fill="#06B6D4" />

  <!-- Corner Status Micro-LEDs -->
  <circle cx="8" cy="8" r="1.8" fill="#38BDF8" opacity="0.8" />
  <circle cx="56" cy="8" r="1.8" fill="#67E8F9" opacity="0.8" />
  <circle cx="8" cy="56" r="1.8" fill="#38BDF8" opacity="0.8" />
  <circle cx="56" cy="56" r="1.8" fill="#10B981" opacity="0.9" />
</svg>