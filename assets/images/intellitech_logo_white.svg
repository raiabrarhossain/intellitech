<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64">
  <defs>
    <linearGradient id="itGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="glowW" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38BDF8" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- ICON BADGE -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="56" height="56" rx="16" fill="url(#itGradW)" filter="url(#glowW)" />
    <rect x="1" y="1" width="54" height="26" rx="15" fill="#ffffff" opacity="0.25" />
    <rect x="0.5" y="0.5" width="55" height="55" rx="15.5" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5" />

    <!-- Circuit Traces -->
    <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.95">
      <line x1="22" y1="6" x2="22" y2="12" />
      <line x1="34" y1="6" x2="34" y2="12" />
      <line x1="22" y1="44" x2="22" y2="50" />
      <line x1="34" y1="44" x2="34" y2="50" />
      <line x1="6" y1="22" x2="12" y2="22" />
      <line x1="6" y1="34" x2="12" y2="34" />
      <line x1="44" y1="22" x2="50" y2="22" />
      <line x1="44" y1="34" x2="50" y2="34" />
    </g>

    <!-- Microchip Core Box -->
    <rect x="14" y="14" width="28" height="28" rx="7" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8" />
    <rect x="18" y="18" width="20" height="20" rx="4" fill="#ffffff" />
    
    <!-- Stylized 'iT' Symbol -->
    <path d="M23 22 H33 V25 H29.5 V34 H26.5 V25 H23 Z" fill="#2563EB" />
    <circle cx="33" cy="32" r="1.8" fill="#06B6D4" />
  </g>

  <!-- TYPOGRAPHY (Dark Mode: White + Sky-400) -->
  <g transform="translate(74, 14)">
    <text x="0" y="24" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="-0.5" fill="#FFFFFF">
      INTELLI<tspan fill="#38BDF8">TECH</tspan>
    </text>

    <text x="1" y="38" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="8.5" letter-spacing="2.8" fill="#94A3B8">
      SOLUTIONS
    </text>

    <circle cx="82" cy="35" r="2.2" fill="#38BDF8" />
    
    <text x="89" y="38" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="8.5" letter-spacing="1.2" fill="#38BDF8">
      SMART LIVING
    </text>
  </g>
</svg>